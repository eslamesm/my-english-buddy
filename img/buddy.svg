<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 420" role="img" aria-label="My English Buddy mascot: a smiling open book with A B C letters and a star">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eaf4ff"/>
    </linearGradient>
    <linearGradient id="cv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="256" cy="372" rx="150" ry="20" fill="#0f172a" opacity="0.10"/>

  <!-- cheerful star character -->
  <g transform="translate(452,150)">
    <path d="M0 -40 L9.4 -12.9 L38 -12.4 L15.2 4.9 L23.5 32.4 L0 16 L-23.5 32.4 L-15.2 4.9 L-38 -12.4 L-9.4 -12.9 Z"
          fill="#fbbf24" stroke="#f59e0b" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="-8" cy="-2" r="3.2" fill="#7c3aed"/><circle cx="8" cy="-2" r="3.2" fill="#7c3aed"/>
    <path d="M-7 8 Q0 15 7 8" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- book cover (behind) -->
  <path d="M256 196 C 202 166, 132 170, 92 200 L 92 344 C 132 314, 202 310, 256 340 Z" fill="url(#cv)"/>
  <path d="M256 196 C 310 166, 380 170, 420 200 L 420 344 C 380 314, 310 310, 256 340 Z" fill="url(#cv)"/>

  <!-- pages -->
  <path d="M256 186 C 206 158, 142 162, 104 190 L 104 328 C 142 300, 206 296, 256 324 Z" fill="url(#pg)"/>
  <path d="M256 186 C 306 158, 370 162, 408 190 L 408 328 C 370 300, 306 296, 256 324 Z" fill="url(#pg)"/>

  <!-- spine -->
  <rect x="249" y="190" width="14" height="134" rx="7" fill="#c7ddff"/>

  <!-- cute face -->
  <circle cx="186" cy="250" r="20" fill="#ffffff" stroke="#d7e3f4" stroke-width="2"/>
  <circle cx="326" cy="250" r="20" fill="#ffffff" stroke="#d7e3f4" stroke-width="2"/>
  <circle cx="189" cy="252" r="9" fill="#334155"/>
  <circle cx="323" cy="252" r="9" fill="#334155"/>
  <circle cx="175" cy="284" r="10" fill="#fca5a5" opacity="0.75"/>
  <circle cx="337" cy="284" r="10" fill="#fca5a5" opacity="0.75"/>
  <path d="M216 290 Q256 320 296 290" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

  <!-- letters A B C -->
  <g font-family="'Comic Sans MS','Segoe UI',Arial,sans-serif" font-weight="900" text-anchor="middle" font-size="46">
    <circle cx="150" cy="96" r="40" fill="#f97316"/>
    <text x="150" y="113" fill="#ffffff">A</text>
    <circle cx="256" cy="70" r="46" fill="#2563eb"/>
    <text x="256" y="89" fill="#ffffff">B</text>
    <circle cx="362" cy="96" r="40" fill="#22c55e"/>
    <text x="362" y="113" fill="#ffffff">C</text>
  </g>
</svg>
